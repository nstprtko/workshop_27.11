apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: demo-api
    template:
      metadata:
        labels:
          app: demo-api
    spec:
      containers:
      - name: web
        image: nginx:1.31.10
        ports:
        - containerPort: 80